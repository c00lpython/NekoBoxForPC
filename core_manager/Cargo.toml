[package]
name = "core_manager"
version = "0.1.0"
edition = "2021"
authors = ["NekoBox Team"]
description = "High-performance proxy core manager and universal config parser for NekoBox"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "nbpfpc"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
url = "2.5"
base64 = "0.22"
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
num_cpus = "1.16"
sha2 = "0.10"
hex = "0.4"
