name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.0.0-beta)'
        required: false
        default: 'v1.0.0-beta'

permissions:
  contents: write

jobs:
  test:
    name: Pre-Release Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest anyio asyncio pyyaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Test Suite
        run: |
          chmod +x test.sh
          ./test.sh

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: nbpfpc-windows-x64.zip
            bin: nbpfpc.exe
            archive: zip
            rustflags: ""

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: nbpfpc-windows7-x64.zip
            bin: nbpfpc.exe
            archive: zip
            rustflags: "-C target-feature=+crt-static"

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: nbpfpc-linux-x64.tar.gz
            bin: nbpfpc
            archive: tar.gz
            rustflags: ""

          - os: macos-latest
            target: aarch64-apple-darwin
            name: nbpfpc-macos-arm64.tar.gz
            bin: nbpfpc
            archive: tar.gz
            rustflags: ""

          - os: macos-latest
            target: x86_64-apple-darwin
            name: nbpfpc-macos-x64.tar.gz
            bin: nbpfpc
            archive: tar.gz
            rustflags: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        working-directory: core_manager
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd core_manager/target/${{ matrix.target }}/release
          7z a ../../../../${{ matrix.name }} ${{ matrix.bin }}

      - name: Package artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd core_manager/target/${{ matrix.target }}/release
          tar -czvf ../../../../${{ matrix.name }} ${{ matrix.bin }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    name: Generate Changelog & Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Compute SHA256 Checksums
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          echo "=== SHA256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Generate Changelog from Git Log
        id: changelog
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" == *"/"* ]]; then
            TAG_NAME="${{ github.event.inputs.version_tag }}"
          fi
          [ -z "$TAG_NAME" ] && TAG_NAME="v1.0.0-beta"

          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")

          echo "Generating changelog for tag $TAG_NAME (previous: ${PREV_TAG:-initial})..."

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG_NAME}"
          else
            RANGE="${TAG_NAME}"
          fi

          echo "## Release Notes ($TAG_NAME)" > release_notes.md
          echo "" >> release_notes.md
          echo "### 🚀 Новые возможности (Features)" >> release_notes.md
          git log "$RANGE" --grep="^feat" --pretty=format:"* %s (%h)" >> release_notes.md || true
          echo "" >> release_notes.md

          echo "### 🐛 Исправления ошибок (Fixes)" >> release_notes.md
          git log "$RANGE" --grep="^fix" --pretty=format:"* %s (%h)" >> release_notes.md || true
          echo "" >> release_notes.md

          echo "### 🛠 Сборка и внутренняя архитектура" >> release_notes.md
          git log "$RANGE" --grep="^\(chore\|build\|ci\|refactor\)" --pretty=format:"* %s (%h)" >> release_notes.md || true
          echo "" >> release_notes.md

          echo "### 📦 Все изменения" >> release_notes.md
          git log "$RANGE" --pretty=format:"* %s (%h)" --no-merges -n 30 >> release_notes.md
          echo "" >> release_notes.md

          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "NekoBoxPlusForPC CLI ${{ env.RELEASE_TAG }}"
          prerelease: true
          body_path: release_notes.md
          files: release_assets/*
