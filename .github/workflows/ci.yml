name: CI

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run All Tests and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest anyio asyncio pyyaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core_manager/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('core_manager/Cargo.lock', 'core_manager/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run Test Suite (test.sh)
        run: |
          chmod +x test.sh
          ./test.sh

  build-cli:
    name: Build CLI (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core_manager/target
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('core_manager/Cargo.lock', 'core_manager/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.target }}-

      - name: Build nbpfpc CLI
        working-directory: core_manager
        run: cargo build --release --target ${{ matrix.target }}

  build-core:
    name: Build Core (sing-box)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build sing-box desktop core
        run: |
          cd libcore
          go build -v -tags "with_conntrack,with_gvisor,with_quic,with_wireguard,with_awg,with_utls,with_clash_api" -o singbox ./cmd/cli
          ls -la singbox
